name: Heartbeat Healthcheck & Deploy

on:
  schedule:
    # Run on the 19th of each month at 04:00 UTC (48h after the 17th cron run)
    - cron: '19 4 19 * *'
  workflow_dispatch:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and commit updated data
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Query Heartbeat APIs & Build Website
        run: npm run build

      - name: Commit Updated Data Snapshot (if changed on cron/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "actions-user"
          git config user.email "actions-user@users.noreply.github.com"
          git add src/data/heartbeatSnapshot.json public/data/healthcheck.json public/openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update monthly 17th cron healthcheck snapshot [skip ci]"
            git push
          else
            echo "No changes in healthcheck snapshot data."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
